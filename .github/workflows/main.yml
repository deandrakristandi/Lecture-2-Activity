name: Update HTML and README

on:
     push:
       branches: [main]

permissions:
     contents: write

jobs:
     update:
       runs-on: ubuntu-latest
       steps:
         # Step 1: Check out the repository
         - name: Checkout repository
           uses: actions/checkout@v4

         # Step 2: Update index.html only if the push came from me
         - name: Update index.html
           if: github.actor == 'deandrakristandi'
           run: |
             echo "Actor: ${{ github.actor }}"
             sed -i '/<\/body>/i <p>Updated by ${{ github.actor }} on '"$(date)"'</p>' index.html

         # Step 3: Log the update in README.md
         - name: Update README
           run: |
             echo "### Updated by ${{ github.actor }} on $(date '+%Y-%m-%d %H:%M:%S') [Commit: $(git rev-parse --short HEAD)]" >> README.md

         # Step 4: Commit and push the changes
         - name: Commit and Push Changes
           run: |
             git config --global user.name "github-actions[bot]"
             git config --global user.email "github-actions[bot]@users.noreply.github.com"
             git add .
             git commit -m "Workflow: Updated HTML and README for ${{ github.actor }}" || echo "No changes to commit"
             git push origin main
